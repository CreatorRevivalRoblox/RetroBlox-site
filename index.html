<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ROBLOX.com - Authentication</title>
    <style>
        body { font-family: 'Lucida Grande', Verdana, sans-serif; background: #5A5A5A; margin: 0; padding: 0; color: #333; }
        #Header { background: #E1E1E1; border-bottom: 1px solid #A7A7A7; padding: 10px; height: 45px; }
        #Container { width: 900px; margin: 20px auto; background: #FFF; border: 1px solid #A7A7A7; padding: 25px; min-height: 400px; }
        .auth-box { width: 400px; margin: 40px auto; border: 1px solid #CCC; padding: 20px; background: #F9F9F9; }
        h1 { font-size: 24px; color: #003366; margin-top: 0; font-weight: normal; }
        .form-label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 12px; }
        .form-input { width: 380px; padding: 4px; margin-bottom: 15px; border: 1px solid #7F9DB9; font-size: 13px; }
        .button-row { margin-top: 10px; }
        .rbx-btn { background: url('https://archive.org') repeat-x; border: 1px solid #777; color: #000; font-weight: bold; padding: 4px 12px; cursor: pointer; font-size: 13px; }
    </style>
    <script src="https://unpkg.com"></script>
</head>
<body>
    <div id="Header">
        <img src="https://archive.org" height="40" alt="ROBLOX">
    </div>
    <div id="Container">
        <div class="auth-box">
            <h1>Log In / Register</h1>
            <label class="form-label">Username:</label>
            <input type="text" id="username" class="form-input">
            <label class="form-label">Password:</label>
            <input type="password" id="password" class="form-input">
            <div class="button-row">
                <button id="loginBtn" class="rbx-btn">Log In</button>
                <button id="registerBtn" class="rbx-btn" style="background:#E1E1E1;">Register</button>
            </div>
        </div>
    </div>
    <script>
        const supabaseUrl = 'https://supabase.co';
        const supabaseKey = 'sb_publishable_key_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnb2lyZGZ1Y3ZpYW9rdXVldnNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg4MDI1NjQsImV4cCI6MjA3NDM3ODU2NH0.t1LR2xCLdL0q7XP5exF0fQ_XFW52Ifc';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function handleRegister() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            if (!user || !pass) { alert('Please enter both username and password.'); return; }
            const { data: existingUser } = await supabase.from('users').select('username').eq('username', user).maybeSingle();
            if (existingUser) { alert('This username is already taken!'); return; }
            const { error } = await supabase.from('users').insert([{ username: user, password_hash: pass }]);
            if (error) { alert('Registration failed: ' + error.message); } else { alert('Registration successful! You can now log in.'); }
        }

        async function handleLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            if (!user || !pass) { alert('Please enter both username and password.'); return; }
            const { data: userData, error } = await supabase.from('users').select('id, username, password_hash').eq('username', user).maybeSingle();
            if (error || !userData) { alert('User not found!'); return; }
            if (userData.password_hash !== pass) { alert('Incorrect password!'); return; }
            alert('Welcome back to RetroBlox!');
            localStorage.setItem('userId', userData.id);
            localStorage.setItem('username', userData.username);
        }

        document.getElementById('registerBtn').addEventListener('click', handleRegister);
        document.getElementById('loginBtn').addEventListener('click', handleLogin);
    </script>
</body>
</html>
