<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ROBLOX.com - Welcome to ROBLOX!</title>
    <style>
        body { font-family: 'Lucida Grande',Verdana,sans-serif; background-color: #5A5A5A; margin: 0; padding: 0; }
        #Banner { background: #E1E1E1 url('https://archive.org') repeat-x; border-bottom: 1px solid #A7A7A7; height: 50px; padding: 5px 20px 0 20px; }
        #Banner .logo { float: left; margin-top: 3px; }
        #Banner .nav { float: left; margin-left: 30px; margin-top: 15px; }
        #Banner .nav a { font-weight: bold; color: #003366; text-decoration: none; font-size: 13px; margin-right: 15px; }
        #Container { width: 900px; margin: 25px auto; background-color: #FFF; border: 1px solid #A7A7A7; padding: 25px; min-height: 450px; box-shadow: 0 0 10px rgba(0,0,0,0.5); text-align: center; }
        h1 { font-size: 28px; color: #003366; margin-top: 20px; font-weight: normal; }
        .welcome-box { margin: 50px auto; width: 500px; border: 1px solid #A7A7A7; padding: 30px; background: #F9F9F9; }
        .btn-green { background: url('https://archive.org') repeat-x; border: 1px solid #555; color: #000; font-weight: bold; height: 35px; padding: 0 25px; cursor: pointer; font-size: 15px; box-shadow: 1px 1px 1px #999; text-decoration: none; display: inline-block; line-height: 32px; }
        .btn-gray { background: #E1E1E1 url('https://archive.org') repeat-x; border: 1px solid #777; color: #000; font-weight: bold; height: 35px; padding: 0 25px; cursor: pointer; font-size: 15px; box-shadow: 1px 1px 1px #999; text-decoration: none; display: inline-block; line-height: 32px; margin-left: 20px; }
        .footer-text { font-size: 11px; color: #555; margin-top: 100px; border-top: 1px solid #E1E1E1; padding-top: 10px; text-align: left; }
    </style>
</head>
<body>

    <div id="Banner">
        <div class="logo">
            <img src="https://archive.org" height="42" alt="ROBLOX">
        </div>
        <div class="nav">
            <a href="#">Games</a>
            <a href="#">Catalog</a>
            <a href="#">Forum</a>
        </div>
    </div>

    <div id="Container">
        <h1>FREE First-Person Shooter and Construction Game</h1>
        
        <div class="welcome-box">
            <p style="font-size: 16px; margin-bottom: 30px;">Welcome to <b>RetroBlox</b>! Choose an option below to continue to your 2009 character profile.</p>
            
            <!-- Кнопки теперь просто перенаправляют на новые страницы -->
            <a href="login.html" class="btn-green">Log In</a>
            <a href="register.html" class="btn-gray">Sign Up</a>
        </div>

        <div class="footer-text">
            ROBLOX, "Online Building Toy", characters, logos and trading dresses are trademarks of ROBLOX Corporation. ©2009
        </div>
    </div>

</body>
</html>
