<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ROBLOX.com - Create Account</title>
    <!-- Подключаем стабильную версию библиотеки Supabase -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { 
            background-color: #eeeeee; 
            color: #000000; 
            font-family: Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            font-size: 12px;
        }
        .roblox-header {
            background-color: #003366;
            padding: 10px 20px;
            color: white;
            font-weight: bold;
            font-size: 24px;
            letter-spacing: 1px;
            border-bottom: 3px solid #002244;
            text-align: left;
        }
        .roblox-header span {
            color: #ffcc00;
        }
        .main-container {
            max-width: 800px;
            margin: 30px auto;
            background: #ffffff;
            border: 1px solid #555555;
            padding: 20px;
        }
        h2 {
            color: #003366;
            font-size: 18px;
            margin-top: 0;
            border-bottom: 1px dashed #555555;
            padding-bottom: 8px;
            text-align: left;
        }
        .registration-table {
            width: 450px;
            margin: 20px 0;
            background: #f5f5f5;
            border: 1px solid #cccccc;
            padding: 15px;
            text-align: left;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 4px;
            color: #333333;
        }
        input { 
            width: 90%; 
            padding: 4px; 
            border: 1px solid #777777; 
            font-family: Verdana, sans-serif;
            font-size: 12px;
        }
        button { 
            background-color: #00cc00; 
            color: white; 
            border: 2px solid #009900; 
            padding: 6px 15px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 13px;
            margin-top: 10px;
        }
        button:hover { 
            background-color: #00ee00; 
        }
        #status { 
            margin-top: 15px; 
            font-weight: bold;
            color: #cc0000; 
        }
        .recovery-link {
            margin-top: 15px;
            display: block;
            color: #003366;
            text-decoration: underline;
            cursor: pointer;
            font-size: 11px;
        }
        .recovery-link:hover {
            color: #ff6600;
        }
    </style>
</head>
<body>

    <div class="roblox-header">
        R<span>O</span>BLOX
    </div>

    <div class="main-container">
        <h2>RetroBlox 2009 - Sign Up</h2>
        <p>Register a new account to build, visit places, and play with friends!</p>

        <div class="registration-table">
            <div class="form-group">
                <label for="username">Choose Username:</label>
                <input type="text" id="username" required placeholder="e.g. Builderman">
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" required>
            </div>
            <button onclick="signUp()">Register ></button>
            <div id="status"></div>
            
            <a class="recovery-link" onclick="recoverAccount()">Did you get hacked or forgot your password? Click here to get a recovery code sent to your email.</a>
        </div>
    </div>

    <script>
        // Инициализируем клиент базы данных в самую первую очередь
        const SUPABASE_URL = "https://supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_key_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnb2lyZGZ1Y3ZpYW9rdXVldnNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg4MDI1NjQsImV4cCI6MjA3NDM3ODU2NH0.t1LR2xCLdL0q7XP5exF0fQ_XFW52Ifc";

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Только после этого объявляем функции работы с ним
        async function signUp() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('status');

            if (!username || !password) {
                statusDiv.innerText = "Error: Please fill in all fields.";
                statusDiv.style.color = "#cc0000";
                return;
            }

            statusDiv.innerText = "Connecting to server...";
            statusDiv.style.color = "#003366";

            const generatedEmail = `${username}@supabase.com`;

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: generatedEmail,
                    password: password,
                    options: {
                        data: { display_name: username }
                    }
                });

                if (error) {
                    statusDiv.innerText = "Error: " + error.message;
                    statusDiv.style.color = "#cc0000";
                } else {
                    statusDiv.innerText = "Success! Account '" + username + "' has been registered. Welcome to 2009!";
                    statusDiv.style.color = "#006600";
                }
            } catch (err) {
                statusDiv.innerText = "System Error: " + err.message;
                statusDiv.style.color = "#cc0000";
            }
        }

        async function recoverAccount() {
            const username = prompt("Enter your Username to receive the recovery code:");
            const statusDiv = document.getElementById('status');
            
            if (!username) return;

            const generatedEmail = `${username.trim()}@supabase.com`;

            statusDiv.innerText = "Sending recovery code...";
            statusDiv.style.color = "#003366";

            try {
                const { data, error } = await supabaseClient.auth.resetPasswordForEmail(generatedEmail);

                if (error) {
                    statusDiv.innerText = "Error: " + error.message;
                    statusDiv.style.color = "#cc0000";
                } else {
                    statusDiv.innerText = "Success! Recovery code sent to " + username + "@supabase.com";
                    statusDiv.style.color = "#006600";
                }
            } catch (err) {
                statusDiv.innerText = "System Error: " + err.message;
                statusDiv.style.color = "#cc0000";
            }
        }
    </script>
</body>
</html>
