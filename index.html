<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroBlox — Вход и Регистрация (2009)</title>
    <style>
        body { font-family: Verdana, sans-serif; background-color: #E1E1E1; margin: 0; padding: 20px; text-align: center; }
        .container { background: #FFFFFF; border: 2px solid #7F7F7F; width: 400px; margin: 50px auto; padding: 20px; box-shadow: 4px 4px 0px #7F7F7F; text-align: left; }
        h2 { color: #002966; margin-top: 0; border-bottom: 2px solid #002966; padding-bottom: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="password"] { width: 95%; padding: 5px; border: 1px solid #A0A0A0; background: #FFF; font-size: 14px; }
        .buttons { margin-top: 20px; display: flex; gap: 10px; }
        button { background: #E1E1E1; border: 2px solid; border-color: #FFF #7F7F7F #7F7F7F #FFF; padding: 5px 15px; font-weight: bold; cursor: pointer; font-size: 14px; }
        button:active { border-color: #7F7F7F #FFF #FFF #7F7F7F; }
    </style>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

<div class="container">
    <h2>RetroBlox Authentication</h2>
    
    <div class="form-group">
        <label for="username-input">Имя пользователя (Никнейм):</label>
        <input type="text" id="username-input" placeholder="Введите ник...">
    </div>
    
    <div class="form-group">
        <label for="password-input">Пароль:</label>
        <input type="password" id="password-input" placeholder="Введите пароль...">
    </div>
    
    <div class="buttons">
        <button id="login-submit-btn">Войти</button>
        <button id="register-submit-btn">Регистрация</button>
    </div>
</div>

<script>
const supabaseUrl = 'https://supabase.co'; 
const supabaseKey = 'sb_publishable_key_eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNnb2lyZGZ1Y3ZpYW9rdXVldnNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg4MDI1NjQsImV4cCI6MjA3NDM3ODU2NH0.t1LR2xCLdL0q7XP5exF0fQ_XFW52Ifc'; 
const supabase = supabase.createClient(supabaseUrl, supabaseKey); 

async function registerUser(username, password) { 
    if (!username || !password) { 
        alert("Заполните все поля!"); 
        return; 
    } 
    const { data: existingUser, error: checkError } = await supabase.from('users').select('username').eq('username', username).maybeSingle(); 
    if (existingUser) { 
        alert("Этот никнейм уже занят! Придумайте другой."); 
        return; 
    } 
    const { data, error } = await supabase.from('users').insert([{ username: username, password_hash: password }]); 
    if (error) { 
        alert("Ошибка при регистрации: " + error.message); 
    } else { 
        alert("Регистрация успешна! Теперь вы можете войти."); 
    } 
} 

async function loginUser(username, password) { 
    if (!username || !password) { 
        alert("Введите ник и пароль!"); 
        return; 
    } 
    const { data: user, error } = await supabase.from('users').select('id, username, password_hash').eq('username', username).maybeSingle(); 
    if (error || !user) { 
        alert("Пользователь с таким ником не найден!"); 
        return; 
    } 
    if (user.password_hash !== password) { 
        alert("Неверный пароль!"); 
        return; 
    } 
    alert("Вы успешно вошли, добро пожаловать в RetroBlox!"); 
    localStorage.setItem('userId', user.id); 
    localStorage.setItem('username', user.username); 
} 

document.getElementById('register-submit-btn')?.addEventListener('click', () => { 
    const userInp = document.getElementById('username-input')?.value; 
    const passInp = document.getElementById('password-input')?.value; 
    registerUser(userInp, passInp); 
}); 

document.getElementById('login-submit-btn')?.addEventListener('click', () => { 
    const userInp = document.getElementById('username-input')?.value; 
    const passInp = document.getElementById('password-input')?.value; 
    loginUser(userInp, passInp); 
});
</script>

</body>
</html>
